org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9 rejects kotlin.multiplatform + com.android.application in one module. These two flags keep
# D4's single CMP composeApp (androidTarget only) building until it is split into composeApp (KMP library)
# + androidApp (application), the AGP 9 recommended layout.
android.builtInKotlin=false
android.newDsl=false
